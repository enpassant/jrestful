quarkus.http.port=8080
quarkus.index-dependency.jrestful-core.group-id=io.github.enpassant
quarkus.index-dependency.jrestful-core.artifact-id=jrestful-core
quarkus.index-dependency.account-api.group-id=io.github.enpassant
quarkus.index-dependency.account-api.artifact-id=jrestful-example-quarkus-api

quarkus.http.auth.basic=true
quarkus.http.auth.permission.accounts.paths=/account,/account/*
quarkus.http.auth.permission.accounts.policy=authenticated

quarkus.security.users.embedded.enabled=true
quarkus.security.users.embedded.plain-text=true
quarkus.security.users.embedded.users.admin=xxx
quarkus.security.users.embedded.users.user=xxx
quarkus.security.users.embedded.roles.admin=admin,user
quarkus.security.users.embedded.roles.user=user

mp.jwt.verify.issuer=jrestful-example
